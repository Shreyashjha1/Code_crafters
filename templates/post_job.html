<!DOCTYPE html>
<html>
<head>
    <title>Post Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f4f7f8;
        }
        .container {
            max-width: 600px;
            margin-top: 80px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
            color: #333;
        }
        .form-control, textarea, input[type="date"] {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #ccc;
            transition: 0.3s;
        }
        .form-control:focus, textarea:focus, input[type="date"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0,123,255,0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        label {
            font-weight: 500;
        }
        small {
            display: block;
            margin-top: -10px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Post Job Requirement</h2>

    <form action="/post_job" method="post">

        <input class="form-control mb-3" name="company" placeholder="Company Name" required>

        <input class="form-control mb-3" name="role" placeholder="Job Role" required>

        <input class="form-control mb-3" name="skills" placeholder="Skills (comma separated)" required>

        <textarea class="form-control mb-3" name="description" placeholder="Job Description" rows="4"></textarea>

        <!-- 🔴 NEW FIELD -->
        <label class="form-label fw-bold">Application Expiry Date</label>
        <input type="date" name="expiry_date" class="form-control mb-1" required>
        <small class="text-muted">Last date for candidates to apply</small>

        <button class="btn mt-3">Submit</button>
    </form>
</div>

</body>
</html>
