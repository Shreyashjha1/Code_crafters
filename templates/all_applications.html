<!DOCTYPE html>
<html>
<head>
    <title>All Applications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
        }

        .container {
            margin-top: 40px;
            max-width: 1000px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-weight: 700;
        }

        .app-card {
            background: #fff;
            color: #333;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .app-card:hover {
            transform: translateY(-5px);
        }

        .score {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .actions a {
            display: block;
            margin-top: 6px;
        }

        .badge-role {
            background: #4ecdc4;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 5px;
            display: inline-block;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📄 All Applications</h1>
        <p>Applicants sorted by highest score</p>
    </div>

    {% if data %}

        {% for app in data %}
            <div class="app-card">

                <!-- LEFT SIDE -->
                <div>
                    <h5>👤 {{ app[0] }}</h5>

                    <small>📄 Resume: {{ app[1] }}</small><br>

                    <span class="badge-role">
                        💼 {{ app[3] or "No Role" }}
                    </span>

                    <p class="mt-2">
                        🛠 Skills: {{ app[4] or "N/A" }}
                    </p>
                </div>

                <!-- RIGHT SIDE -->
                <div class="text-end">

                    <div class="score">
                        {{ app[2] }}%
                    </div>

                    <div class="actions">
                        <a href="/download_application_resume/{{ app[1] }}" 
                           class="btn btn-success btn-sm">
                           ⬇ Download
                        </a>

                        <a href="/delete_application/{{ app[1] }}" 
                           class="btn btn-danger btn-sm">
                           ❌ Delete
                        </a>
                    </div>

                </div>

            </div>
        {% endfor %}

    {% else %}
        <div class="text-center mt-5">
            <h4>No applications yet 😔</h4>
        </div>
    {% endif %}

</div>

</body>
</html>
