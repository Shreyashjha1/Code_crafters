<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI Resume Analyzer helps job seekers match resumes to roles and gives recruiters a clearer hiring workspace."
    />
    <title>AI Resume Analyzer</title>
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("resume-ai-theme");
          const shouldUseDark =
            storedTheme === "dark" ||
            (!storedTheme &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          document.documentElement.classList.toggle("dark", shouldUseDark);
          document.documentElement.style.colorScheme = shouldUseDark
            ? "dark"
            : "light";
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
